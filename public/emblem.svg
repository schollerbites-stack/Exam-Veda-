<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient for White Squircle -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Royal Navy to Blue Gradient for Cap -->
    <linearGradient id="capGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="45%" stop-color="#0e2a66" />
      <stop offset="100%" stop-color="#06163a" />
    </linearGradient>

    <!-- Top Cap Bevel Highlight -->
    <linearGradient id="capHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Orange / Gold Student Head & Body Gradient -->
    <linearGradient id="orangeStudent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="35%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <linearGradient id="orangeBodyLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Layered Book Page Gradients (3 Distinct Layers) -->
    <!-- Top Glowing Cyan Layer -->
    <linearGradient id="bookLayerTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8" />
      <stop offset="60%" stop-color="#0077b6" />
      <stop offset="100%" stop-color="#023e8a" />
    </linearGradient>

    <!-- Middle Royal Blue Layer -->
    <linearGradient id="bookLayerMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f2b60" />
    </linearGradient>

    <!-- Bottom Deep Navy Layer -->
    <linearGradient id="bookLayerBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="50%" stop-color="#0f2b60" />
      <stop offset="100%" stop-color="#06122c" />
    </linearGradient>

    <!-- Typography Gradients -->
    <linearGradient id="textVedaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="softCardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10" />
    </filter>

    <filter id="elementShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#071b4a" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Clean Outer Rounded White Card -->
  <rect width="512" height="512" rx="104" fill="url(#cardBg)" />
  <rect x="2" y="2" width="508" height="508" rx="102" fill="none" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- MAIN ARTWORK GROUP -->
  <g transform="translate(0, -6)">

    <!-- 1. GRADUATION CAP (MORTARBOARD) -->
    <!-- Cap Diamond Top -->
    <polygon points="256,76 366,118 256,160 146,118" fill="url(#capGradient)" filter="url(#elementShadow)" />
    
    <!-- Top Facet Light Highlight -->
    <polygon points="256,76 146,118 256,160 256,76" fill="url(#capHighlight)" opacity="0.35" />

    <!-- Cap Base (Arch Headband Underneath) -->
    <path d="M 194,142 L 194,166 C 194,186 318,186 318,166 L 318,142 C 294,152 218,152 194,142 Z" fill="#091d44" />

    <!-- Tassel Hanging to the Right -->
    <circle cx="256" cy="118" r="4.5" fill="#38bdf8" />
    <path d="M 256,118 Q 346,124 352,154" fill="none" stroke="#091d44" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="352" cy="158" r="5" fill="#091d44" />
    <path d="M 346,162 L 358,162 L 362,192 L 342,192 Z" fill="#091d44" filter="url(#elementShadow)" />

    <!-- 2. STUDENT HEAD (ORANGE GLOWING CIRCLE) -->
    <circle cx="256" cy="176" r="23" fill="url(#orangeStudent)" filter="url(#elementShadow)" />
    <!-- Specular Highlight on Head -->
    <ellipse cx="250" cy="168" rx="7" ry="5" fill="#ffffff" opacity="0.45" />

    <!-- 3. STUDENT FIGURE (V-ARMS REACHING UPWARDS) -->
    <g filter="url(#elementShadow)">
      <!-- Left Wing / Arm -->
      <path d="M 166,168 C 196,186 244,236 256,278 L 244,278 C 226,230 186,188 166,168 Z" fill="url(#orangeBodyLight)" />
      <!-- Right Wing / Arm -->
      <path d="M 346,168 C 316,186 268,236 256,278 L 268,278 C 286,230 326,188 346,168 Z" fill="url(#orangeStudent)" />
      <!-- Central Body V Core -->
      <path d="M 166,168 C 206,192 248,242 256,278 C 264,242 306,192 346,168 C 314,212 272,268 256,290 C 240,268 198,212 166,168 Z" fill="url(#orangeStudent)" />
    </g>

    <!-- 4. OPEN BOOK PAGES (3 SYMMETRICAL LAYERS) -->
    <g filter="url(#elementShadow)">
      <!-- Layer 1: Bottom Flaps (Deep Navy) -->
      <path d="M 256,312 C 180,300 110,320 62,342 C 108,328 178,312 256,322 Z" fill="url(#bookLayerBottom)" />
      <path d="M 256,312 C 332,300 402,320 450,342 C 404,328 334,312 256,322 Z" fill="url(#bookLayerBottom)" />

      <!-- Layer 2: Middle Pages (Royal Blue) -->
      <path d="M 256,306 C 180,288 105,306 58,328 C 104,312 178,296 256,314 Z" fill="url(#bookLayerMid)" />
      <path d="M 256,306 C 332,288 407,306 454,328 C 408,312 334,296 256,314 Z" fill="url(#bookLayerMid)" />

      <!-- Layer 3: Top Curved Pages (Glowing Cyan-Blue) -->
      <path d="M 256,298 C 180,274 110,290 92,306 C 132,286 186,274 256,298 Z" fill="url(#bookLayerTop)" />
      <path d="M 256,298 C 332,274 402,290 420,306 C 380,286 326,274 256,298 Z" fill="url(#bookLayerTop)" />

      <!-- Center Spine Notch -->
      <polygon points="256,294 248,314 264,314" fill="#06163a" />
    </g>

    <!-- 5. BRAND TYPOGRAPHY: "Edu Veda" -->
    <g transform="translate(256, 396)">
      <!-- "Edu" Text (Deep Navy Bold) -->
      <text x="-66" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="64" letter-spacing="-1.5" fill="#082353">Edu</text>
      
      <!-- "Veda" Text (Vibrant Warm Orange) -->
      <text x="66" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="64" letter-spacing="-1.5" fill="url(#textVedaGrad)">Veda</text>
    </g>

  </g>
</svg>
